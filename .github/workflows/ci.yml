name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Live FatSecret tests skip themselves without credentials, so CI runs
      # only the offline suite (schemas, OAuth, local foods, aggregation, BMR).
      - run: npm test
